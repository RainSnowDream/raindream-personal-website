/* ===== 博客页 ===== */
.blog-page{padding-top:80px}
.blog-page .section{padding:60px 24px}

/* ===== 博客文章卡片 ===== */
.blog-post{background:var(--bg-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border-card);border-radius:20px;padding:40px;margin-bottom:32px;box-shadow:var(--shadow);transition:opacity .7s ease var(--reveal-delay,0s),transform .7s cubic-bezier(.25,.1,.25,1) var(--reveal-delay,0s),box-shadow .3s ease,border-color .3s ease}
.blog-post:hover{box-shadow:var(--shadow-lg);border-color:var(--blue-soft)}
.blog-post-header{margin-bottom:28px}
.blog-post-date{font-size:13px;font-weight:500;color:var(--text-3);letter-spacing:0.04em;margin-bottom:6px}
.blog-post-title{font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-0.02em;line-height:1.3;margin-bottom:10px;color:var(--text)}
.blog-post-trigger{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;padding:0;border-radius:8px}
.blog-post-trigger:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.blog-post-toggle{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-3);transition:transform .35s ease,background .3s ease,color .3s ease}
.blog-post.open .blog-post-toggle{transform:rotate(180deg);background:var(--blue-soft);border-color:transparent;color:var(--text)}
.blog-post-tags{display:flex;gap:6px;flex-wrap:wrap}
.blog-post-tags span{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;background:var(--tag-bg);color:var(--tag-text);letter-spacing:0.02em}
.blog-post-tags span:nth-child(odd){background:var(--blue-soft);color:var(--text)}
.blog-post-tags span:nth-child(even){background:var(--pink-soft);color:var(--text)}
.blog-post-divider{height:1px;background:var(--border-card);margin:28px 0}

/* 折叠区：视觉折叠的同时从无障碍树与焦点序列中移除 */
.blog-post-body-wrap{max-height:0;overflow:hidden;visibility:hidden;opacity:0;margin-top:0;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .4s ease,margin .4s ease,visibility 0s linear .5s}
.blog-post.open .blog-post-body-wrap{visibility:visible;opacity:1;margin-top:20px;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .4s ease,margin .4s ease,visibility 0s}

/* ===== 正文排版 ===== */
.blog-post-body{font-size:17px;line-height:2.1;color:var(--text-2);overflow-wrap:break-word}
.blog-post-plain{white-space:pre-wrap;overflow-wrap:anywhere}
.blog-post-body p{margin-bottom:18px}
.blog-post-body h1,.blog-post-body h2,.blog-post-body h3{color:var(--text);font-weight:700;letter-spacing:-0.01em;line-height:1.45;margin:32px 0 14px}
.blog-post-body h1{font-size:24px}
.blog-post-body h2{font-size:20px}
.blog-post-body h3{font-size:17px}
.blog-post-body>:first-child{margin-top:0}
.blog-post-body ul,.blog-post-body ol{margin:0 0 18px;padding-left:26px}
.blog-post-body ul{list-style:disc}
.blog-post-body ol{list-style:decimal}
.blog-post-body li{margin-bottom:8px;line-height:1.9}
.blog-post-body li::marker{color:var(--blue)}
.blog-post-body a{color:var(--blue);text-decoration:underline;text-decoration-color:var(--blue-soft);text-underline-offset:3px;transition:color .2s ease,text-decoration-color .2s ease}
.blog-post-body a:hover{color:var(--pink);text-decoration-color:var(--pink)}
.blog-post-body strong{color:var(--text);font-weight:600}
.blog-post-body blockquote{margin:0 0 18px;padding:2px 0 2px 18px;border-left:2px solid var(--blue-soft)}
.blog-post-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--tag-bg);padding:2px 6px;border-radius:6px}
.blog-post-body pre{background:var(--tag-bg);border:1px solid var(--border-card);padding:16px;border-radius:12px;overflow-x:auto;line-height:1.7;margin:0 0 18px}
.blog-post-body pre code{background:none;padding:0;font-size:.88em}
.blog-post-body table{display:block;width:100%;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:0 0 18px}
.blog-post-body img{height:auto;border-radius:12px}
.blog-post-body hr{border:0;border-top:1px solid var(--border);margin:28px 0}

/* ===== 搜索 ===== */
.blog-search{position:relative;margin-bottom:40px;max-width:500px}
.blog-search input{width:100%;padding:14px 20px 14px 44px;border-radius:28px;border:1px solid var(--border-card);background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:15px;color:var(--text);outline:none;transition:border-color .3s ease,box-shadow .3s ease;font-family:inherit}
.blog-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.blog-search input::placeholder{color:var(--text-3)}
.blog-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.blog-no-results{text-align:center;padding:60px 20px;color:var(--text-3);font-size:15px}
/* 没有文字时不要占位置：配合 JS 设置 textContent，空的时候用 :empty 收起来 */
.blog-no-results:empty{display:none;padding:0}

/* ===== 返回首页 ===== */
.blog-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:40px;font-size:14px;font-weight:500;color:var(--text-2);transition:color .3s ease}
.blog-back:hover{color:var(--text)}
.blog-back-arrow{transition:transform .3s ease}
.blog-back:hover .blog-back-arrow{transform:translateX(-3px)}

/* ===== 响应式（博客页专属） ===== */
@media(max-width:768px){
.blog-post{padding:24px}
.blog-page .section{padding:40px 20px}
.blog-post-toggle{width:26px;height:26px}
.blog-search input{font-size:14px}
.blog-back{margin-bottom:28px}
}
@media(max-width:480px){
.blog-post{padding:20px 16px}
.blog-post-title{font-size:24px}
.blog-post-body{font-size:16px;line-height:1.95}
.blog-post-body ul,.blog-post-body ol{padding-left:22px}
.blog-search input{padding-left:40px;font-size:14px}
.blog-page .section{padding:28px 14px}
}

/* 老浏览器不支持背景模糊时改用不透明底色 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.blog-post,.blog-search input{background:var(--bg-card-solid)}
}

<script>
(function(){
/* marked 18 起 setOptions 已不推荐使用，优先用 use()；老版本回退到 setOptions */
if(typeof marked!=='undefined'){
if(typeof marked.use==='function')marked.use({breaks:true,gfm:true});
else marked.setOptions({breaks:true,gfm:true});
}
/* posts.js 没加载成功时（最常见的原因是正文里写了反引号，把 JavaScript 语法弄坏了），
   给一句明确提示，而不是留一整页空白。具体报错可以在浏览器控制台看到。 */
if(typeof posts==='undefined'){
var feedEl=document.getElementById('blogFeed');
if(feedEl)feedEl.innerHTML='<p class="blog-no-results">文章数据没能加载。请检查 posts.js 是否有语法错误（常见原因是正文里用了反引号）。</p>';
return;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* 轻量净化：去掉脚本/内联事件/javascript: 链接（正文是作者自写的 Markdown，这里只做兜底） */
function sanitizeHtml(h){
var allowedTags={
A:1,P:1,BR:1,HR:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,
UL:1,OL:1,LI:1,STRONG:1,EM:1,DEL:1,S:1,BLOCKQUOTE:1,
CODE:1,PRE:1,IMG:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1,
DIV:1,SPAN:1
};
var allowedAttrs={
A:{href:1,title:1},
IMG:{src:1,alt:1,title:1,width:1,height:1},
TH:{colspan:1,rowspan:1,align:1},
TD:{colspan:1,rowspan:1,align:1}
};
function cleanUrl(value,mode){
var v=String(value||'').replace(/[\u0000-\u001F]/g,'').trim();
if(!v)return null;
if(/^\/\//.test(v))return null; // 阻止协议相对 URL（//evil.com）
var m=/^([a-zA-Z][a-zA-Z0-9+.-]*):/.exec(v);
if(m){
var scheme=m[1].toLowerCase();
if(mode==='href'&&(scheme==='http'||scheme==='https'||scheme==='mailto'))return v;
if(mode==='src'&&(scheme==='http'||scheme==='https'))return v;
if(mode==='src'&&scheme==='data'&&/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(v))return v;
return null;
}
return v;
}
function cleanAttrs(el){
var tag=el.tagName.toUpperCase();
var allowed=allowedAttrs[tag]||{};
var attrs=[].slice.call(el.attributes);
for(var i=0;i<attrs.length;i++){
var attr=attrs[i];
var name=attr.name.toLowerCase();
if(!allowed[name]){el.removeAttribute(attr.name);continue;}
if(name==='href'){
var safe=cleanUrl(attr.value,'href');
el.setAttribute('href',safe===null?'#':safe);
}else if(name==='src'){
var safeSrc=cleanUrl(attr.value,'src');
if(safeSrc===null)el.removeAttribute(attr.name);
else el.setAttribute('src',safeSrc);
}
}
}
function cleanNode(node){
if(!node)return;
if(node.nodeType===8){node.parentNode.removeChild(node);return;}
if(node.nodeType!==1)return;
var tag=node.tagName.toUpperCase();
if(!allowedTags[tag]){
var children=[].slice.call(node.childNodes);
for(var i=0;i<children.length;i++)cleanNode(children[i]);
var parent=node.parentNode;
if(!parent)return;
while(node.firstChild)parent.insertBefore(node.firstChild,node);
parent.removeChild(node);
return;
}
cleanAttrs(node);
var kids=[].slice.call(node.childNodes);
for(var j=0;j<kids.length;j++)cleanNode(kids[j]);
}
var tpl=document.createElement('template');
tpl.innerHTML=String(h);
var roots=[].slice.call(tpl.content.childNodes);
for(var k=0;k<roots.length;k++)cleanNode(roots[k]);
return tpl.innerHTML;
}

var bodyCache=[];
var searchCache=[];
function getBodyHtml(p){
if(!bodyCache[p.id]){
var bodyHtml=typeof marked!=='undefined'?marked.parse(p.body):'<div class="blog-post-plain">'+escapeHtml(p.body)+'</div>';
bodyCache[p.id]=sanitizeHtml(bodyHtml).replace(/<a /g,'<a target="_blank" rel="noopener" ');
}
return bodyCache[p.id];
}
function getSearchText(p){
if(!searchCache[p.id])searchCache[p.id]=(p.title+' '+p.tags.join(' ')+' '+p.excerpt+' '+p.body).toLowerCase();
return searchCache[p.id];
}

var feed=document.getElementById('blogFeed');
var searchInput=document.getElementById('blogSearch');
var noResults=document.getElementById('blogNoResults');

function renderPosts(filter){
filter=(filter||'').toLowerCase();
posts.sort(function(a,b){return b.date.localeCompare(a.date);});
feed.innerHTML='';
var fragment=document.createDocumentFragment();
var found=0;
posts.forEach(function(p){
var bodyHtml=getBodyHtml(p);
var searchText=getSearchText(p);
if(filter&&searchText.indexOf(filter)===-1)return;
found++;
var post=document.createElement('article');
post.className='blog-post reveal';
post.style.setProperty('--reveal-delay',((found-1)*0.06)+'s');
var pid='post-'+p.id;
post.innerHTML=
'<div class="blog-post-header">'+
'<p class="blog-post-date">'+escapeHtml(p.date)+'</p>'+
'<h2 class="blog-post-title">'+
'<button type="button" class="blog-post-trigger" id="'+pid+'-trigger" aria-expanded="false" aria-controls="'+pid+'-body">'+
'<span class="blog-post-trigger-text">'+escapeHtml(p.title)+'</span>'+
'<span class="blog-post-toggle" aria-hidden="true">▼</span>'+
'</button>'+
'</h2>'+
'<div class="blog-post-tags">'+p.tags.map(function(t){return '<span>'+escapeHtml(t)+'</span>';}).join('')+'</div>'+
'</div>'+
'<div class="blog-post-divider"></div>'+
'<div class="blog-post-body-wrap" id="'+pid+'-body" role="region" aria-labelledby="'+pid+'-trigger" aria-hidden="true">'+
'<div class="blog-post-body">'+bodyHtml+'</div>'+
'</div>';

var trigger=post.querySelector('.blog-post-trigger');
var wrap=post.querySelector('.blog-post-body-wrap');
function setOpen(open){
if(open){
wrap.style.maxHeight=wrap.scrollHeight+'px';
post.classList.add('open');
wrap.setAttribute('aria-hidden','false');
wrap.inert=false;
}else{
wrap.style.maxHeight=wrap.scrollHeight+'px';
void wrap.offsetHeight;
post.classList.remove('open');
wrap.setAttribute('aria-hidden','true');
wrap.inert=true;
wrap.style.maxHeight='0px';
}
trigger.setAttribute('aria-expanded',open?'true':'false');
}
trigger.addEventListener('click',function(){setOpen(!post.classList.contains('open'));});
wrap.addEventListener('transitionend',function(ev){
if(ev.propertyName==='max-height'&&post.classList.contains('open'))wrap.style.maxHeight='none';
});
fragment.appendChild(post);
});
feed.appendChild(fragment);
noResults.textContent=found===0?'没有找到匹配的文章':'';
var revealPosts=[].slice.call(document.querySelectorAll('.blog-post.reveal'));
for(var qi=0;qi<revealPosts.length;qi++)window.revealObserve(revealPosts[qi]);
}

var searchTimer=null;
searchInput.addEventListener('input',function(){
var q=this.value;
if(searchTimer)clearTimeout(searchTimer);
searchTimer=setTimeout(function(){renderPosts(q);},150);
});
renderPosts('');
})();
</script>
